apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-core
  labels:
    app: {{ .Chart.Name }}-core
spec:
  replicas: {{ .Values.services.core.replicas }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}-core
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-core
    spec:
      containers:
        - name: core
          image: "{{ .Values.global.repository }}/core-service:{{ .Values.global.tag }}"
          imagePullPolicy: {{ .Values.global.pullPolicy }}
          ports:
            - containerPort: {{ .Values.services.core.port }}
          env:
            - name: MONGO_URL
              value: "mongodb://{{ .Chart.Name }}-mongo:27017"
            - name: DB_NAME
              value: "fintrack"
            - name: SECRET_KEY
              value: "kubernetes-secret-key"
          livenessProbe:
            httpGet:
              path: /docs
              port: {{ .Values.services.core.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /docs
              port: {{ .Values.services.core.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-core
spec:
  selector:
    app: {{ .Chart.Name }}-core
  ports:
    - port: 80
      targetPort: {{ .Values.services.core.port }}
